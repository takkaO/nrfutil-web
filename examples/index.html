<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nrfutil-web — DFU Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    .section {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .section h2 { font-size: 1rem; margin-bottom: 0.75rem; }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      background: #0066cc;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #0052a3; }
    button:disabled { background: #999; cursor: not-allowed; }
    .status {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #555;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
      display: none;
    }
    .progress-fill {
      height: 100%;
      background: #0066cc;
      width: 0%;
      transition: width 0.2s;
    }
    .log {
      background: #111;
      color: #0f0;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.75rem;
      border-radius: 4px;
      height: 200px;
      overflow-y: auto;
      margin-top: 0.5rem;
      white-space: pre-wrap;
    }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.9rem;
      min-width: 200px;
    }
  </style>
</head>
<body>
  <h1>nrfutil-web — DFU Test</h1>

  <div class="section">
    <h2>1. Firmware</h2>
    <div class="row">
      <input type="text" id="firmware-url" placeholder="ZIP URL (e.g. /firmware.zip)">
    </div>
    <div class="row" style="margin-top: 0.5rem;">
      <span style="font-size: 0.85rem; color: #555;">or select a file:</span>
      <input type="file" id="firmware-file" accept=".zip">
    </div>
  </div>

  <div class="section">
    <h2>2. Connect</h2>
    <div class="row">
      <button id="btn-connect">Connect</button>
      <button id="btn-dfu-mode" disabled>Enter DFU Mode</button>
      <button id="btn-connect-dfu" disabled>Connect DFU Port</button>
    </div>
    <div class="status" id="connect-status">Not connected</div>
  </div>

  <div class="section">
    <h2>3. Flash</h2>
    <button id="btn-flash" disabled>Start DFU</button>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="status" id="flash-status"></div>
  </div>

  <div class="section">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </div>

<script type="module">
    import { performDfu, enterDfuMode } from "../src/index.ts";

    const $ = (id) => document.getElementById(id);

    let appPort = null;
    let dfuPort = null;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      $("log").textContent += `[${time}] ${msg}\n`;
      $("log").scrollTop = $("log").scrollHeight;
    }

    async function getFirmwareData() {
      const fileInput = $("firmware-file");
      if (fileInput.files.length > 0) {
        log("Reading firmware from file...");
        return await fileInput.files[0].arrayBuffer();
      }

      const url = $("firmware-url").value.trim();
      if (url) {
        log(`Fetching firmware from ${url}...`);
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
        return await response.arrayBuffer();
      }

      throw new Error("No firmware selected.");
    }

    $("btn-connect").addEventListener("click", async () => {
      try {
        appPort = await navigator.serial.requestPort();
        log("Application port selected.");
        $("connect-status").textContent = "Application port connected.";
        $("btn-dfu-mode").disabled = false;
      } catch (err) {
        log(`Connect error: ${err.message}`);
      }
    });

    $("btn-dfu-mode").addEventListener("click", async () => {
      if (!appPort) return;
      try {
        log("Sending 1200bps touch...");
        await enterDfuMode(appPort);
        log("Device should reset to bootloader. Select the DFU port.");
        $("connect-status").textContent = "DFU mode triggered. Click 'Connect DFU Port'.";
        $("btn-connect-dfu").disabled = false;
        $("btn-dfu-mode").disabled = true;
      } catch (err) {
        log(`DFU mode error: ${err.message}`);
      }
    });

    $("btn-connect-dfu").addEventListener("click", async () => {
      try {
        dfuPort = await navigator.serial.requestPort();
        log("DFU port selected.");
        $("connect-status").textContent = "DFU port connected. Ready to flash.";
        $("btn-flash").disabled = false;
      } catch (err) {
        log(`DFU connect error: ${err.message}`);
      }
    });

    $("btn-flash").addEventListener("click", async () => {
      if (!dfuPort) return;
      $("btn-flash").disabled = true;
      $("progress-bar").style.display = "block";
      $("progress-fill").style.width = "0%";

      try {
        const zipData = await getFirmwareData();
        log(`Firmware loaded: ${zipData.byteLength} bytes`);

        await performDfu(dfuPort, zipData, {
          onProgress: ({ percent, message }) => {
            $("progress-fill").style.width = `${percent}%`;
            $("flash-status").textContent = `${percent}% — ${message}`;
            log(message);
          },
        });

        log("DFU complete!");
        $("flash-status").textContent = "DFU complete!";
      } catch (err) {
        log(`DFU error: ${err.message}`);
        $("flash-status").textContent = `Error: ${err.message}`;
      } finally {
        $("btn-flash").disabled = false;
      }
    });

    log("Ready. Select firmware and connect to device.");
  </script>
</body>
</html>
